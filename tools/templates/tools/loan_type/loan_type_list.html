{% extends 'base.html' %}

{% block content %}
<style>
  .card-grid {
    transition: 0.3s;
  }

  .card-grid:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
  }
</style>
<div class="card ">

  <div class="card-header">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="btn btn-primary" href="{% url 'loan-type-create' %}"><i class="fas fa-plus"></i> Add New</a>
        </li>
      </ul>
    </nav>
  </div>

  <div class="card-body">


    <!-- Navbar -->


    <!-- Sidebar -->
    <!-- <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link">
      <i class="fas fa-cash-register brand-image img-circle elevation-3"></i>
      <span class="brand-text font-weight-light">Sales ERP</span>
    </a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column">
          <li class="nav-item"><a href="#" class="nav-link active"><i class="nav-icon fas fa-list"></i><p>Data List</p></a></li>
        </ul>
      </nav>
    </div>
  </aside> -->

    <!-- Content -->
    <section class="content-header">
      <div class="d-flex justify-content-between align-items-center px-3">
        <h1>Loan Types</h1>
        <div class="btn-group">
          <button class="btn btn-outline-secondary" id="grid-view-btn"><i class="fas fa-th"></i></button>
          <button class="btn btn-outline-secondary" id="list-view-btn"><i class="fas fa-list"></i></button>
        </div>
      </div>
    </section>

    <section class="content px-3">
      <!-- List View -->
      <div id="list-view">
        <table id="data-table" class="table table-bordered table-hover">
          <thead>
            <tr>
              <!-- <th>#</th> -->
              <th>Id</th>
              <th>Value</th>
              <th>Description</th>
              <th>Created Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>

      <!-- Grid View -->
      <div id="grid-view" class="row d-none">
      </div>
    </section>
  </div>


</div>
</div>


{% endblock content %}

{% block javascript %}
<script>
  $(document).ready(function () {
    loadDataList();
  });

  function loadDataList() {
    $.ajax({
      url: "{% url 'loan-type-lists' %}",
      method: "GET",
      success: function (data) {
        $('#data-table tbody').empty();
        $('#grid-view').empty();

        data.forEach(function (item) {
          // Table Row
          var tr = `
                      <tr>
                          <td>${item.id}</td>
                          <td>${item.value}</td>
                          <td>${item.description || '-'}</td>
                          <td>${item.createdDateAd || '-'}</td>
                          <td>
                              <button class="btn btn-sm btn-info" onclick="window.location.href='/tools/loanType/${item.id}/edit'"><i class="fas fa-edit"></i></button>
                              <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
                          </td>
                      </tr>
                  `;
          $('#data-table tbody').append(tr);

          // Grid Card
          var card = `
                      <div class="col-md-4">
                          <div class="card card-grid">
                              <div class="card-body">
                                  <h5>${item.value}</h5>
                                  <p class="text-muted">${item.description || '-'}</p>
                                  <p><small class="text-muted">Date: ${item.createdDateAd || '-'}</small></p>
                                  <div class="d-flex justify-content-between">
                                      <button class="btn btn-sm btn-info" onclick="window.location.href='/tools/loanType/${item.id}/edit'"><i class="fas fa-edit"></i></button>
                                      <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
                                  </div>
                              </div>
                          </div>
                      </div>
                  `;
          $('#grid-view').append(card);
        });

        $('#data-table').DataTable();
      },
      error: function (err) {
        console.error("Error loading data:", err);
      }
    });
  }

  $(function () {
    $('#grid-view-btn').on('click', function () {
      $('#list-view').addClass('d-none');
      $('#grid-view').removeClass('d-none');
    });

    $('#list-view-btn').on('click', function () {
      $('#grid-view').addClass('d-none');
      $('#list-view').removeClass('d-none');
    });
  });
</script>
{% endblock javascript %}
