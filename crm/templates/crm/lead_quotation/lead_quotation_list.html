    transition: 0.3s;

  .card-grid:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
  }
</style>
<div class="card ">

  <div class="card-header">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="btn btn-primary" href="{% url 'lead-quotation-create' %}"><i class="fas fa-plus"></i> Add New</a>
        </li>
      </ul>
    </nav>
  </div>

  <div class="card-body">


    <!-- Navbar -->


    <!-- Sidebar -->
    <!-- <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link">
      <i class="fas fa-cash-register brand-image img-circle elevation-3"></i>
      <span class="brand-text font-weight-light">Sales ERP</span>
    </a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column">
          <li class="nav-item"><a href="#" class="nav-link active"><i class="nav-icon fas fa-list"></i><p>Data List</p></a></li>
        </ul>
      </nav>
    </div>
  </aside> -->

    <!-- Content -->
    <section class="content-header">
      <div class="d-flex justify-content-between align-items-center px-3">
        <h1>Items</h1>
        <div class="btn-group">
          <button class="btn btn-outline-secondary" id="grid-view-btn"><i class="fas fa-th"></i></button>
          <button class="btn btn-outline-secondary" id="list-view-btn"><i class="fas fa-list"></i></button>
        </div>
      </div>
    </section>

    <section class="content px-3">
      <!-- List View -->
      <div id="list-view">
        <table id="leadquotationTable" class="table table-bordered table-hover">
          <thead>
            <tr>
              <!-- <th>#</th> -->
              <th>Name</th>
              <th>Mobile Number</th>
              <th>Permanent Address</th>
              <th>Loan Amount</th>
              <th>Tenure</th>
              <th>Interest Rate (%)</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>

    </section>
  </div>


</div>
</div>


{% endblock content %}

{% block javascript %}
<script>

  $(document).ready(function () {
    leadQuotationList("{% url 'lead-quotation-lists' %}");
  })
  $(function () {
    $('#data-table').DataTable();

    $('#grid-view-btn').on('click', function () {
      $('#list-view').addClass('d-none');
      $('#grid-view').removeClass('d-none');
    });

    $('#list-view-btn').on('click', function () {
      $('#grid-view').addClass('d-none');
      $('#list-view').removeClass('d-none');
    });
  });


  function leadQuotationList(requestUrl) {
    $.ajax({
      url: requestUrl,
      method: "GET",
      dataType: "json",
      contentType: "application/json",
      success: function (data) {

        $('#leadquotationTable tbody').empty();

        var data = data.datas;

        data.forEach(function (item) {
          var tr = `
            <tr>
              <td>${item.firstName} ${item.lastName}</td>
              <td>${item.mobileNumber}</td>
              <td>${item.permanentMunicipality}, ${item.permanentDistrict}</td>
              <td class="text-left">Rs. ${formatCurrency(item.loanAmount)}</td>
              <td>${item.tenure}</td>
              <td>${item.interestRate}</td>
              <td>${item.createdAt}</td>
              <td></td>
            </tr>
            
            `;

          $('#leadquotationTable tbody').append(tr);
        });
      },
      error: function (jqXHR, textStatus, errorMessage) {
        console.error('Error loading inquiry follow-up:', errorMessage);
      }
    });
  }
</script>
{% endblock javascript %}
