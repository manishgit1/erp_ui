{% extends 'base.html' %}

{% block content %}
{% include 'crm/lead_quotation/lead_quotation.html' %}
{% endblock %}


{% block javascript %}


<script>
   $(document).ready(function () {

      //  $('#leadQuotationLoanType').select2();
      //  $('#leadQuotationSource').select2();

      $('.select2').select2({
         width: '100%' // Ensure Select2 respects the container width
      });

      loadSelectElementData("leadQuotationLoanType", "{% url 'loan-type-lists' %}", "", "");
      loadSelectElementData("leadQuotationSource", "{% url 'lead-source-lists' %}", "", "");

      loadSelectElementData("leadQuotationPermanentMunicipality", "{% url 'general-settings-lists' %}", "setupType", "vdcMunicipality");
      loadSelectElementData("leadQuotationPermanentDistrict", "{% url 'general-settings-lists' %}", "setupType", "district");
      loadSelectElementData("leadQuotationPermanentProvince", "{% url 'general-settings-lists' %}", "setupType", "province");




      var $steps = $('.step');
      var $nextBtns = $('.next-btn');
      var $prevBtns = $('.prev-btn');
      var $tabPanes = $('.tab-pane');
      var currentStep = 0;

      function showStep(index) {
         $tabPanes.each(function (i) {
            if (i === index) {
               $(this).addClass('show active');
            } else {
               $(this).removeClass('show active');
            }
         });

         // Highlight the steps
         $steps.each(function (i) {
            if (i <= index) {
               $(this).addClass('active');
            } else {
               $(this).removeClass('active');
            }
         });

         currentStep = index;
      }

      $nextBtns.on('click', function () {
         const $btn = $(this);
         if ($btn.attr('id') == 'btnNextMobileNumberInformation') {
            var mobileNumber = $('#leadQuotationMobileNumber').val().trim();
            if (!mobileNumber) {
               toastrErrorMessage('Mobile Number is required.');
               return;
            }
            var inputJson = {
               'mobileNumber': mobileNumber
            };

            $('#leadQuotationCustomerName, #leadQuotationContactNumber, #leadQuotationPermanentMunicipality, #leadQuotationPermanentProvince, #leadQuotationPermanentDistrict, #leadQuotationEmail').val('');

            checkIfMobileContactExists("{% url 'check-if-contact-exists' %}", inputJson).done(function (data) {
               if (data.hasOwnProperty("resultCode") && data.resultCode == '0') {
                  if (currentStep < $steps.length - 1) {
                     showStep(currentStep + 1);
                  }
               }
            });
         } else {
            if (currentStep < $steps.length - 1) {
               showStep(currentStep + 1);
            }
         }
      });

      $prevBtns.on('click', function () {
         if (currentStep > 0) {
            showStep(currentStep - 1);
         }
      });

      $steps.on('click', function () {
         var index = $steps.index(this);
         showStep(index);
      });

      // Initial show
      showStep(0);
   });


   $('#leadQuotationLoanAmount').on("input", function () {
      formatCurrency($(this).val());
   })



   function checkIfMobileContactExists(requestUrl, jsonData) {
      return $.ajax({
         url: requestUrl + "?jsonData=" + encodeURI(JSON.stringify(jsonData)),
         method: "GET",
         dataType: "json",
         success: function (data) {
            if (data.hasOwnProperty("resultCode")) {
               if (data.resultCode == '0') {
                  data = data.globalContactData;

                  $('#leadQuotationCustomerName').val(data.firstName + ' ' + data.lastName);
                  $('#leadQuotationContactNumber').val(data.mobileNumber);
                  $('#leadQuotationPermanentMunicipality').val(data.permanentMunicipality).change();
                  $('#leadQuotationPermanentProvince').val(data.permanentProvince).change();
                  $('#leadQuotationPermanentDistrict').val(data.permanentDistrict).change();
                  $('#leadQuotationPermanentWardNo').val(data.permanentWardNo);
                  $('#leadQuotationEmail').val(data.email);
               } else {
                  toastrErrorMessage("Contact does not exist");
               }
            }
         },
         error: function () {
            toastrErrorMessage("Error checking contact");
         }
      })
   }


   $('#btnSaveLeadQuotation').off('click').on('click', function () {
      var form = $("#leadQuotationForm");

      // Validate required fields
      var loanAmount = $('#leadQuotationLoanAmount').val().trim();
      var interestRate = $('#leadQuotationInterestRate').val().trim();
      var tenure = $('#leadQuotationLoanTenure').val().trim();
      var errors = [];

      if (!loanAmount || isNaN(parseFloat(loanAmount)) || parseFloat(loanAmount) <= 0) {
         errors.push('Loan Amount is required and must be a positive number.');
         $('#leadQuotationLoanAmount').addClass('is-invalid');
      } else {
         $('#leadQuotationLoanAmount').removeClass('is-invalid');
      }

      if (!interestRate || isNaN(parseFloat(interestRate)) || parseFloat(interestRate) <= 0) {
         errors.push('Interest Rate is required and must be a positive number.');
         $('#leadQuotationInterestRate').addClass('is-invalid');
      } else {
         $('#leadQuotationInterestRate').removeClass('is-invalid');
      }

      if (!tenure || isNaN(parseInt(tenure)) || parseInt(tenure) <= 0) {
         errors.push('Tenure is required and must be a positive number.');
         $('#leadQuotationLoanTenure').addClass('is-invalid');
      } else {
         $('#leadQuotationLoanTenure').removeClass('is-invalid');
      }

      if (errors.length > 0) {
         errors.forEach(function (msg) {
            toastrErrorMessage(msg);
         });
         return;
      }

      var inputJson = convertToJsonForLeadQuotation();

      openConfirmSaveModal(inputJson, 'leadQuotationForm', saveInsertUpdateData, "{% url 'lead-quotation-create' %}", "{% url 'lead-quotation-list' %}");

   })

   function convertToJsonForLeadQuotation() {
      var leadQuotationData = {};

      leadQuotationData.mobileNumber = $('#leadQuotationMobileNumber').val();

      leadQuotationData.requestType = $('#leadQuotationRequestType').val();
      // leadQuotationData.permanentMunicipality = $('#leadQuotationPermanentMunicipality').val();
      leadQuotationData.customerName = $('#leadQuotationCustomerName').val();
      // leadQuotationData.permanentDistrict = $('#leadQuotationPermanentDistrict').val();
      // leadQuotationData.permanentProvince = $('#leadQuotationPermanentProvince').val();
      leadQuotationData.email = $('#leadQuotationEmail').val();
      // leadQuotationData.permanentWardNo = $('#leadQuotationPermanentWardNo').val();

      leadQuotationData.loanType = $('#leadQuotationLoanType').val();
      leadQuotationData.leadSource = $('#leadQuotationSource').val();
      leadQuotationData.loanAmount = $('#leadQuotationLoanAmount').val();
      leadQuotationData.interestRate = $('#leadQuotationInterestRate').val();
      leadQuotationData.tenure = $('#leadQuotationLoanTenure').val();
      leadQuotationData.remarks = $('#leadQuotationRemarks').val();

      return JSON.stringify(leadQuotationData);
   }


   // ── EMI Schedule ─────────────────────────────────────────────
   $('#btnEmiSchedule').off('click').on('click', function () {
      var loanAmount = $('#leadQuotationLoanAmount').val();
      var interestRate = $('#leadQuotationInterestRate').val();
      var tenure = $('#leadQuotationLoanTenure').val();

      // ── Validation ────────────────────────────────────────────
      var errors = [];
      if (!loanAmount || isNaN(parseFloat(loanAmount)) || parseFloat(loanAmount) <= 0) {
         errors.push('Loan Amount is required and must be a positive number.');
      }
      if (!interestRate || isNaN(parseFloat(interestRate)) || parseFloat(interestRate) <= 0) {
         errors.push('Interest Rate is required and must be a positive number.');
      }
      if (!tenure || isNaN(parseInt(tenure)) || parseInt(tenure) <= 0) {
         errors.push('Tenure is required and must be a positive number.');
      }

      if (errors.length > 0) {
         errors.forEach(function (msg) {
            toastrErrorMessage(msg);
         });
         return;
      }

      // Show loading state in modal
      var $tbody = $('#emiScheduleTableBody');
      $tbody.html(
         '<tr><td colspan="6" class="text-center py-4">' +
         '<div class="emi-loading"><div class="spinner-border text-primary" role="status"></div>' +
         '<span>Calculating EMI Schedule...</span></div></td></tr>'
      );

      // Set summary cards with input values
      $('#emiSummaryLoanAmount').text('Rs. ' + parseFloat(loanAmount).toLocaleString('en-IN'));
      $('#emiSummaryInterestRate').text(interestRate + '%');
      $('#emiSummaryTenure').text(tenure + ' months');
      $('#emiSummaryMonthlyEmi').html('<div class="spinner-border spinner-border-sm" role="status"></div>');

      // Open modal immediately
      var emiModal = new bootstrap.Modal(document.getElementById('emiScheduleModal'));
      emiModal.show();

      // Call API
      $.ajax({
         url: "{% url 'lead-quotation-emi-schedule' %}",
         method: 'GET',
         data: {
            loanAmount: loanAmount,
            interestRate: interestRate,
            tenure: tenure
         },
         dataType: 'json',
         success: function (response) {
            var datas = response.datas || {};
            var items = datas.emiScheduleData || [];

            // Update summary cards from API response
            $('#emiSummaryLoanAmount').text('Rs. ' + parseFloat(datas.loanAmount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 }));
            $('#emiSummaryInterestRate').text((datas.interestRate || 0) + '%');
            $('#emiSummaryTenure').text((datas.tenure || 0) + ' months');
            $('#emiSummaryMonthlyEmi').text('Rs. ' + parseFloat(datas.emi || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 }));

            // Total interest & total payment footer
            $('#emiTotalInterest').html(
               '<strong>Total Interest:</strong> Rs. ' + parseFloat(datas.totalInterest || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 }) +
               '  &nbsp;|&nbsp;  <strong>Total Payment:</strong> Rs. ' + parseFloat(datas.totalPayment || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 })
            );

            var rows = '';
            if (items.length > 0) {
               items.forEach(function (item, index) {
                  rows += '<tr>' +
                     '<td>' + (index + 1) + '</td>' +
                     '<td>' + item.month + '</td>' +
                     '<td class="text-end">Rs. ' + parseFloat(item.emi).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
                     '<td class="text-end">Rs. ' + parseFloat(item.principal).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
                     '<td class="text-end">Rs. ' + parseFloat(item.interest).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
                     '<td class="text-end">Rs. ' + parseFloat(item.balance).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
                     '</tr>';
               });
            } else {
               rows = '<tr><td colspan="6" class="text-center py-4 text-muted">' +
                  '<i class="bi bi-exclamation-circle me-1"></i>No schedule data returned</td></tr>';
               $('#emiSummaryMonthlyEmi').text('-');
               $('#emiTotalInterest').text('');
            }

            $tbody.html(rows);
         },
         error: function (xhr) {
            var errMsg = 'Failed to fetch EMI schedule.';
            try {
               var resp = JSON.parse(xhr.responseText);
               errMsg = resp.message || errMsg;
            } catch (e) { }
            $tbody.html(
               '<tr><td colspan="6" class="text-center py-4 text-danger">' +
               '<i class="bi bi-x-circle me-1"></i>' + errMsg + '</td></tr>'
            );
            $('#emiSummaryMonthlyEmi').text('-');
            $('#emiTotalInterest').text('');
            toastrErrorMessage(errMsg);
         }
      });
   });


</script>

{% endblock %}
