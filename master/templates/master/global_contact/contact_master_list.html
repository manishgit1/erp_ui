{% block javascript %}
<script>

  $(document).ready(function () {
    loadContactMasterList("{% url 'contact-master-lists' %}");
  })
  $(function () {
    // $('#contactMasterTable').DataTable();

    $('#grid-view-btn').on('click', function () {
      $('#list-view').addClass('d-none');
      $('#grid-view').removeClass('d-none');
    });

    $('#list-view-btn').on('click', function () {
      $('#grid-view').addClass('d-none');
      $('#list-view').removeClass('d-none');
    });
  });


  function loadContactMasterList(requestUrl) {
    $.ajax({
      url: requestUrl,
      method: "GET",
      dataType: "json",
      contentType: "application/json",
      success: function (data) {

        $('#contactMasterTable tbody').empty();

        var data = data.datas;

        data.forEach(function (item) {
          var tr = `
            <tr>
              <td>${item.firstName} ${item.lastName}</td>
              <td>${item.mobileNumber}</td>
              <td>${item.permanentMunicipalityName}, ${item.permanentDistrictName}</td>
              <td>${item.citizenshipNumber}</td>
              <td>
                <button type="button" class="btn btn-sm btn-info" onclick="showUpdatePage('/master/contact/${item.referenceId}/edit')"><i class="fas fa-edit"></i></button>
              </td>
            </tr>
            
            `;

          $('#contactMasterTable tbody').append(tr);
        });
      },
      error: function (jqXHR, textStatus, errorMessage) {
        console.error('Error loading inquiry follow-up:', errorMessage);
      }
    });
  }


  function showConfirmModal(url) {
    var modalElement = document.getElementById('confirmModal');
    var modal = new bootstrap.Modal(modalElement);

    // Store data on the modal DOM element itself (preferred over jQuery .data for consistency)
    modalElement._inputJson = inputJson;
    modalElement._formId = formId;
    modalElement._callBackFunction = callBackFunction;
    modalElement._requestUrl = requestUrl;

    modal.show();

    // Remove previous click handlers and add a fresh one
    $('#btnYesModal').off('click').on('click', function () {

      window.location.href = url;
      modal.hide();
    });
  }



</script>
{% endblock javascript %}
