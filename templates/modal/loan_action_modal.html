<!-- Loan Request Action Modal -->
<div class="modal fade" id="loanActionModal" tabindex="-1" aria-labelledby="loanActionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="loanActionModalTitle">Loan Request Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <table class="table table-sm table-bordered mb-3">
                    <tbody>
                        <tr>
                            <th class="bg-light" style="width: 40%;">Customer Name</th>
                            <td id="modalClientName"></td>
                        </tr>
                        <tr>
                            <th class="bg-light">Address</th>
                            <td id="modalClientAddress"></td>
                        </tr>
                        <tr>
                            <th class="bg-light">Loan Amount</th>
                            <td id="modalLoanAmount"></td>
                        </tr>
                        <tr>
                            <th class="bg-light">Interest Rate</th>
                            <td id="modalInterestRate"></td>
                        </tr>
                    </tbody>
                </table>

                <div class="form-group">
                    <label for="loanActionRemarks" class="form-label">Remarks <span id="remarksRequiredLabel"
                            class="text-danger d-none">*</span></label>
                    <textarea class="form-control" id="loanActionRemarks" rows="3"
                        placeholder="Enter remarks..."></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn" id="btnLoanActionSubmit">Submit</button>
            </div>

        </div>
    </div>
</div>
