{% extends 'base.html' %}

{% block title %}User Setup{% endblock %}

{% block content %}
<style>
    .page-header-bar {
        background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
        border-radius: 10px;
        padding: 18px 24px;
        margin-bottom: 22px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .page-header-bar h4 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
    }

    .page-header-bar .breadcrumb-text {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 2px;
    }

    .badge-active {
        background: #dcfce7;
        color: #16a34a;
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 0.76rem;
        font-weight: 600;
    }

    .badge-inactive {
        background: #fee2e2;
        color: #dc2626;
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 0.76rem;
        font-weight: 600;
    }

    .badge-role {
        background: #ede9fe;
        color: #7c3aed;
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 0.76rem;
        font-weight: 600;
    }

    .btn-action {
        padding: 4px 10px;
        font-size: 0.78rem;
        border-radius: 6px;
    }
</style>

<!-- Page Header -->
<div class="page-header-bar">
    <div>
        <h4><i class="fas fa-users-cog mr-2"></i> User Setup</h4>
        <div class="breadcrumb-text">Settings &rsaquo; User Setup</div>
    </div>
    <div class="d-flex gap-2">
        <a href="{% url 'settings-menu' %}" class="btn btn-outline-light btn-sm mr-2">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
        <a href="{% url 'user-setup-create' %}" class="btn btn-light btn-sm">
            <i class="fas fa-plus mr-1"></i> Add New User
        </a>
    </div>
</div>

<!-- Table Card -->
<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
            <span class="font-weight-bold text-secondary"
                style="font-size:0.82rem; text-transform:uppercase; letter-spacing:1px;">
                All Users
            </span>
            <span class="text-muted" style="font-size:0.82rem;" id="userCountLabel">Loading...</span>
        </div>
        <div class="p-3">
            <table id="userSetupTable" class="table table-bordered table-hover table-sm">
                <thead class="thead-light">
                    <tr>
                        <th>#</th>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

{% endblock content %}

{% block javascript %}
<script>
    $(document).ready(function () {
        loadUserSetupList("{% url 'user-setup-lists' %}");
    });

    function loadUserSetupList(requestUrl) {
        $.ajax({
            url: requestUrl,
            method: "GET",
            dataType: "json",
            success: function (data) {
                var tbody = $('#userSetupTable tbody');
                tbody.empty();

                if (data.resultCode !== '0') {
                    showErrorMessageAfterAjaxResponse(data);
                    return;
                }

                var rows = data.datas || [];
                $('#userCountLabel').text(rows.length + ' record(s)');

                rows.forEach(function (item, idx) {
                    var statusBadge = item.status
                        ? '<span class="badge-active">Active</span>'
                        : '<span class="badge-inactive">Inactive</span>';
                    var roleBadge = item.roleName
                        ? '<span class="badge-role">' + escapeHtml(item.roleName) + '</span>'
                        : '<span class="text-muted">—</span>';

                    var tr = `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${escapeHtml(item.fullName)}</td>
                        <td>${escapeHtml(item.username || '—')}</td>
                        <td>${escapeHtml(item.email || '—')}</td>
                        <td>${roleBadge}</td>
                        <td>${statusBadge}</td>
                        <td>${item.createdAt || '—'}</td>
                        <td>
                            <button class="btn btn-info btn-action mr-1"
                                onclick="showUpdatePage('/user/${item.referenceId}/edit')">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>
                `;
                    tbody.append(tr);
                });

                $('#userSetupTable').DataTable({
                    destroy: true,
                    order: [[0, 'asc']],
                    language: { search: "_INPUT_", searchPlaceholder: "Search users..." }
                });
            },
            error: function () {
                toastrErrorMessage("Failed to load user list.");
            }
        });
    }
</script>
{% endblock javascript %}
